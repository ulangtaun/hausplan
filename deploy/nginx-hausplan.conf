# Nginx als Reverse Proxy vor Gunicorn  ->  /etc/nginx/sites-available/hausplan
# ln -s /etc/nginx/sites-available/hausplan /etc/nginx/sites-enabled/hausplan
# rm /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx

# Cloudflare sendet https; lokal im LAN ist es http.
map $http_x_forwarded_proto $hp_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # cloudflared läuft auf demselben Container und verbindet sich über 127.0.0.1.
    # Die echte Besucher-IP steht im Header CF-Connecting-IP.
    # Quelle: https://developers.cloudflare.com/support/troubleshooting/restoring-visitor-ips/restoring-original-visitor-ips/
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 1m;

    # Statische Dateien direkt durch Nginx ausliefern (entlastet Gunicorn)
    location /static/ {
        alias /opt/hausplan/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $hp_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
